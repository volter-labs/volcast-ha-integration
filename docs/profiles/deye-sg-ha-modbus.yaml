# Raw register sensors for Volcast control through an existing Home Assistant Modbus hub.
#
# Add the `sensors:` entries below to the hub you ALREADY use for the inverter (the same `name:` and the same
# device address). Do NOT add a second `modbus:` hub or a second connection: two masters on one gateway
# corrupt each other's requests.
#
# Rules Volcast checks:
#   * `unique_id` is exactly `volcast_reg_<register address>` (this is how a sensor is matched to a register);
#   * `input_type: holding`, `data_type: uint16`, one register per sensor;
#   * no `scale`, `offset`, `precision` or `swap`: the sensor must report the raw 16-bit word, as an integer;
#   * `slave` equals the device address you enter in Volcast.
# Sensors you already have for the same registers must be replaced by (or renamed to) these raw ones.
# Signed values are decoded by Volcast from the raw word, so keep `uint16` for every register.
# The list covers every register the Deye SG read plan needs (51 registers); a block with one missing
# register is not read at all.
#
# Replace `slave: 1` with your device address.
sensors:
  - name: "Volcast reg 0"
    unique_id: volcast_reg_0
    address: 0
    slave: 1
    input_type: holding
    data_type: uint16
    scan_interval: 30
  - name: "Volcast reg 3"
    unique_id: volcast_reg_3
    address: 3
    slave: 1
    input_type: holding
    data_type: uint16
    scan_interval: 30
